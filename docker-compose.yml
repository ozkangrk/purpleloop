version: "3.8"

services:
  nginx-misconfigured:
    image: nginx:1.25-alpine
    ports:
      - "8081:80"
    volumes:
      - ./lab/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/nginx/html:/usr/share/nginx/html:ro
    networks:
      - purplelab

  minio-s3:
    image: minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: purplelab
      MINIO_ROOT_PASSWORD: purplelab-secret
    ports:
      - "9010:9000"   # host 9000 meşgul (buzz-minio) olduğu için 9010
      - "9011:9001"
    volumes:
      - minio-data:/data
    networks:
      - purplelab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # public bucket + ekili sahte parolalar (lab only)
  minio-init:
    image: minio/minio:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set plab http://minio-s3:9000 purplelab purplelab-secret 2>/dev/null; do sleep 2; done &&
        mc mb -p plab/public || true &&
        mc anonymous set download plab/public &&
        printf 'db_password=PurpleL00pBucket-2026\nadmin_pwd=S3cret-Bucket-Passw0rd\napi_token=purpleloop-fake-api-token-42\n' > /tmp/k.txt &&
        mc cp /tmp/k.txt plab/public/credentials-leaked.txt &&
        echo 'minio-init done'
    networks:
      - purplelab

volumes:
  minio-data:

networks:
  purplelab:
    driver: bridge
