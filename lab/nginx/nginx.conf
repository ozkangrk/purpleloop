server {
    listen 80;
    server_name _;

    # Deliberately misconfigured lab target: directory listing + no hardening.
    location / {
        root /usr/share/nginx/html;
        autoindex on;
        index nonexistent.html;
    }

    # Deliberate sensitive exposure (lab only, fake secrets).
    location /backup/ {
        alias /usr/share/nginx/html/backup/;
        autoindex on;
    }
}
